<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استعادة كلمة المرور | مَجرى</title>
<style>
:root {
  --bg-deep: #0b0f19;
  --bg-card: #111827;
  --border: #374151;
  --cyan: #06b6d4;
  --emerald: #10b981;
  --amber: #f59e0b;
  --red: #ef4444;
  --text-primary: #f3f4f6;
  --text-secondary: #9ca3af;
  --text-muted: #6b7280;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  background: var(--bg-deep);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  padding: 40px 20px;
}
a { text-decoration: none; color: inherit; }
body::before {
  content: '';
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background-image:
    linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}
.back-link {
  position: fixed; top: 24px; right: 32px;
  font-size: 12px; color: var(--text-muted);
  transition: color .25s; z-index: 10;
}
.back-link:hover { color: var(--cyan); }
.recovery-container {
  width: 100%; max-width: 460px;
  padding: 20px;
  position: relative; z-index: 1;
}
.recovery-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 40px 36px;
  position: relative; overflow: hidden;
}
.recovery-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--amber), var(--red));
}
.recovery-logo { text-align: center; margin-bottom: 24px; }
.recovery-logo .icon { font-size: 36px; color: var(--amber); margin-bottom: 8px; }
.recovery-logo h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
.recovery-logo p { font-size: 11px; color: var(--text-muted); }
.step-indicator {
  display: flex; justify-content: center; align-items: center;
  gap: 8px; margin-bottom: 32px;
}
.step {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; color: var(--text-muted);
}
.step-num {
  width: 24px; height: 24px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
  background: var(--bg-deep); border: 1px solid var(--border);
  color: var(--text-muted);
}
.step.active .step-num { background: var(--amber); border-color: var(--amber); color: var(--bg-deep); }
.step.active { color: var(--text-primary); }
.step-line { width: 32px; height: 1px; background: var(--border); }
.form-group { margin-bottom: 22px; }
.form-group label {
  display: block; font-size: 12px; font-weight: 600;
  color: var(--text-secondary); margin-bottom: 8px;
}
.input-wrapper { position: relative; }
.input-wrapper .input-icon {
  position: absolute; right: 14px; top: 50%;
  transform: translateY(-50%); font-size: 14px; color: var(--text-muted);
}
.form-input {
  width: 100%; padding: 12px 42px 12px 16px;
  background: var(--bg-deep); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text-primary);
  font-size: 13px; font-family: inherit; transition: all .25s;
}
.form-input::placeholder { color: var(--text-muted); }
.form-input:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 3px rgba(245,158,11,0.1); }
.verification-section { margin-bottom: 22px; }
.verification-section label {
  display: block; font-size: 12px; font-weight: 600;
  color: var(--text-secondary); margin-bottom: 10px;
}
.code-box {
  display: flex; gap: 10px; justify-content: center;
  direction: ltr;
}
.code-digit {
  width: 48px; height: 52px;
  text-align: center;
  background: var(--bg-deep); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text-primary);
  font-size: 20px; font-weight: 700; font-family: 'Courier New', monospace;
  transition: all .25s;
}
.code-digit:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 3px rgba(245,158,11,0.1); }
.resend-link {
  text-align: center; font-size: 11px; color: var(--text-muted);
  margin-top: 10px;
}
.resend-link a { color: var(--cyan); transition: color .25s; }
.resend-link a:hover { color: var(--amber); }
.form-row-double {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
}
.btn-recover {
  width: 100%; padding: 14px;
  background: var(--amber); color: var(--bg-deep);
  border: none; border-radius: 8px;
  font-size: 14px; font-weight: 700; cursor: pointer;
  transition: all .25s; font-family: inherit;
  display: block; text-align: center; margin-top: 8px;
}
.btn-recover:hover { box-shadow: 0 0 24px rgba(245,158,11,0.4); transform: translateY(-1px); }
.login-link { text-align: center; font-size: 12px; color: var(--text-secondary); margin-top: 20px; }
.login-link a { color: var(--cyan); font-weight: 600; transition: color .25s; }
.login-link a:hover { color: var(--emerald); }
</style>
</head>
<body>
<a href="login.html" class="back-link">← العودة لتسجيل الدخول</a>
<div class="recovery-container">
  <div class="recovery-card">
    <div class="recovery-logo">
      <div class="icon">⚿</div>
      <h1>استعادة كلمة المرور</h1>
      <p>قم بالخطوات التالية لاستعادة الوصول إلى حسابك</p>
    </div>
    <div class="step-indicator">
      <div class="step active"><div class="step-num">١</div><span>البريد</span></div>
      <div class="step-line"></div>
      <div class="step active"><div class="step-num">٢</div><span>التحقق</span></div>
      <div class="step-line"></div>
      <div class="step active"><div class="step-num">٣</div><span>كلمة جديدة</span></div>
    </div>
    <form>
      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <div class="input-wrapper">
          <span class="input-icon">✉</span>
          <input type="email" class="form-input" placeholder="أدخل بريدك الإلكتروني المسجّل">
        </div>
      </div>
      <div class="verification-section">
        <label>رمز التحقق — أدخل الأرقام الستة المرسلة إلى بريدك</label>
        <div class="code-box">
          <input type="text" class="code-digit" maxlength="1" value="">
          <input type="text" class="code-digit" maxlength="1" value="">
          <input type="text" class="code-digit" maxlength="1" value="">
          <input type="text" class="code-digit" maxlength="1" value="">
          <input type="text" class="code-digit" maxlength="1" value="">
          <input type="text" class="code-digit" maxlength="1" value="">
        </div>
        <p class="resend-link">لم يصلك الرمز؟ <a href="#">إعادة إرسال الرمز</a></p>
      </div>
      <div class="form-row-double">
        <div class="form-group">
          <label>كلمة المرور الجديدة</label>
          <div class="input-wrapper">
            <span class="input-icon">⚿</span>
            <input type="password" class="form-input" placeholder="••••••••">
          </div>
        </div>
        <div class="form-group">
          <label>تأكيد كلمة المرور</label>
          <div class="input-wrapper">
            <span class="input-icon">⚿</span>
            <input type="password" class="form-input" placeholder="••••••••">
          </div>
        </div>
      </div>
      <a href="login.html" class="btn-recover">استعادة كلمة المرور والدخول</a>
    </form>
    <p class="login-link">تذكّرت كلمة المرور؟ <a href="login.html">العودة لتسجيل الدخول</a></p>
  </div>
</div>
</body>
</html>
