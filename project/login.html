<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | مَجرى</title>
<style>
:root {
  --bg-deep: #0b0f19;
  --bg-card: #111827;
  --border: #374151;
  --cyan: #06b6d4;
  --emerald: #10b981;
  --amber: #f59e0b;
  --red: #ef4444;
  --text-primary: #f3f4f6;
  --text-secondary: #9ca3af;
  --text-muted: #6b7280;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  background: var(--bg-deep);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
a { text-decoration: none; color: inherit; }
body::before {
  content: '';
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background-image:
    linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}
.back-link {
  position: fixed; top: 24px; right: 32px;
  font-size: 12px; color: var(--text-muted);
  transition: color .25s;
  z-index: 10;
}
.back-link:hover { color: var(--cyan); }

.login-container {
  width: 100%; max-width: 420px;
  padding: 20px;
  position: relative; z-index: 1;
}
.login-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 40px 36px;
  position: relative;
  overflow: hidden;
}
.login-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--cyan), var(--emerald));
}
.login-logo {
  text-align: center; margin-bottom: 28px;
}
.login-logo .icon {
  font-size: 36px; color: var(--cyan);
  margin-bottom: 8px;
}
.login-logo h1 {
  font-size: 22px; font-weight: 800;
  margin-bottom: 4px;
}
.login-logo p {
  font-size: 11px; color: var(--text-muted);
}
.status-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px;
  background: rgba(16,185,129,0.08);
  border: 1px solid rgba(16,185,129,0.2);
  border-radius: 8px;
  margin-bottom: 28px;
}
.status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--emerald);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.status-bar span {
  font-size: 11px; color: var(--emerald);
}
.form-group {
  margin-bottom: 22px;
}
.form-group label {
  display: block;
  font-size: 12px; font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 8px;
}
.input-wrapper {
  position: relative;
}
.input-wrapper .input-icon {
  position: absolute;
  right: 14px; top: 50%;
  transform: translateY(-50%);
  font-size: 14px; color: var(--text-muted);
}
.form-input {
  width: 100%;
  padding: 12px 42px 12px 16px;
  background: var(--bg-deep);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-primary);
  font-size: 13px;
  font-family: inherit;
  transition: all .25s;
}
.form-input::placeholder { color: var(--text-muted); }
.form-input:focus {
  outline: none;
  border-color: var(--cyan);
  box-shadow: 0 0 0 3px rgba(6,182,212,0.1);
}
.form-row {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 28px;
}
.checkbox-wrapper {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; color: var(--text-secondary);
  cursor: pointer;
}
.checkbox-wrapper input[type="checkbox"] {
  accent-color: var(--cyan);
}
.forgot-link {
  font-size: 11px; color: var(--cyan);
  transition: color .25s;
}
.forgot-link:hover { color: var(--emerald); }
.btn-login {
  width: 100%;
  padding: 14px;
  background: var(--cyan);
  color: var(--bg-deep);
  border: none; border-radius: 8px;
  font-size: 14px; font-weight: 700;
  cursor: pointer;
  transition: all .25s;
  font-family: inherit;
  display: block;
  text-align: center;
  margin-bottom: 24px;
}
.btn-login:hover {
  box-shadow: 0 0 24px rgba(6,182,212,0.4);
  transform: translateY(-1px);
}
.divider {
  text-align: center;
  margin: 20px 0;
  position: relative;
}
.divider::before {
  content: '';
  position: absolute; top: 50%; right: 0; left: 0;
  height: 1px; background: var(--border);
}
.divider span {
  background: var(--bg-card);
  padding: 0 12px;
  font-size: 11px; color: var(--text-muted);
  position: relative;
}
.signup-link {
  text-align: center;
  font-size: 12px; color: var(--text-secondary);
}
.signup-link a {
  color: var(--cyan); font-weight: 600;
  transition: color .25s;
}
.signup-link a:hover { color: var(--emerald); }
</style>
</head>
<body>
<a href="index.html" class="back-link">← العودة للرئيسية</a>
<div class="login-container">
  <div class="login-card">
    <div class="login-logo">
      <div class="icon">◆</div>
      <h1>مَجرى</h1>
      <p>نظام الإنذار المبكر من السيول</p>
    </div>
    <div class="status-bar">
      <div class="status-dot"></div>
      <span>النظام يعمل — جميع أجهزة الرادار متصلة</span>
    </div>
    <form>
      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <div class="input-wrapper">
          <span class="input-icon">✉</span>
          <input type="email" class="form-input" placeholder="أدخل بريدك الإلكتروني">
        </div>
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <div class="input-wrapper">
          <span class="input-icon">⚿</span>
          <input type="password" class="form-input" placeholder="أدخل كلمة المرور">
        </div>
      </div>
      <div class="form-row">
        <label class="checkbox-wrapper">
          <input type="checkbox" checked> تذكّرني على هذا الجهاز
        </label>
        <a href="forgot-password.html" class="forgot-link">نسيت كلمة المرور؟</a>
      </div>
      <a href="majra.html" class="btn-login">الدخول إلى نظام الرادار</a>
      <div class="divider"><span>أو</span></div>
      <p class="signup-link">ليس لديك حساب؟ <a href="signup.html">إنشاء حساب راصد جديد</a></p>
    </form>
  </div>
</div>
</body>
</html>
